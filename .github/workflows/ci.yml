name: CI

# Runs on every push and pull request. No network is needed: conftest.py
# stubs the hermes-agent tool registry, so the suite runs without the
# framework installed. If this is red, do not deploy.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # cffi is a hidden hard dependency: without it pytest dies at
        # collection with pyo3_runtime.PanicException.
        run: pip install pytest gspread google-auth cffi

      - name: Run the suite
        run: pytest tests/ -q

      - name: schema.sql is derived, never hand-edited
        # Fails if a migration was added without regenerating schema.sql.
        run: python supabase/build_schema.py --check

      - name: Shell scripts parse
        run: |
          bash -n deploy/start.sh
          bash -n cron/setup-cron-jobs.sh
          bash -n scripts/setup-google-oauth.sh

      - name: No personal data in the tree
        # The scrub gate. The identifiers of the original deployment live in
        # the repository secret SCRUB_PATTERN (an extended regex), so this
        # file does not publish the strings it guards. On the canonical repo
        # a missing secret fails the job, and so does a pattern grep cannot
        # run (for example an invalid regex). Forks, fork pull requests and
        # Dependabot runs receive no secrets, so the gate skips there. If you
        # fork and later publish, set your own SCRUB_PATTERN.
        env:
          SCRUB_PATTERN: ${{ secrets.SCRUB_PATTERN }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -z "$SCRUB_PATTERN" ]; then
            if [ "$GITHUB_REPOSITORY" = "alhazjm/kevin-agent" ] && [ "$IS_FORK_PR" != "true" ] && [ "$GITHUB_ACTOR" != "dependabot[bot]" ]; then
              echo "::error::SCRUB_PATTERN secret is missing"; exit 1
            fi
            echo "::notice::scrub gate skipped: SCRUB_PATTERN is not set"; exit 0
          fi
          # -l prints file names only, so a match never echoes the value.
          # grep exits 0 on a match, 1 on no match, 2 when it cannot run.
          set +e
          grep -rlIE -e "$SCRUB_PATTERN" --exclude-dir=.git .
          rc=$?
          set -e
          case $rc in
            0) echo "::error::personal identifiers found in the files listed above"; exit 1 ;;
            1) echo "scrub gate clean" ;;
            *) echo "::error::scrub gate could not run (grep exit $rc); check that SCRUB_PATTERN is a valid extended regex"; exit 1 ;;
          esac
