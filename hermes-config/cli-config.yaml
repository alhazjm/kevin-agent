model:
  default: "gpt-5.4-nano"
  provider: "custom"
  base_url: "https://api.openai.com/v1"
  max_tokens: 8192

smart_model_routing:
  enabled: true
  max_simple_chars: 180
  max_simple_words: 30
  # Simple-turn route. Was legacy "gpt-5-nano", whose dated snapshot leaves
  # the API on 2026-12-11 (the floating alias would silently repoint to a
  # different model). OpenAI's migration table names gpt-5.4-nano as the
  # replacement; the price gap between the two legs is noise at our volume.
  cheap_model:
    provider: "custom"
    model: "gpt-5.4-nano"
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"

terminal:
  backend: "local"
  cwd: "."
  timeout: 180

memory:
  mode: "local"

# Voice STT — explicit, config-keyed, no auto-detect. After PR #63 evicted
# local faster-whisper, the auto-detect chain was supposed to fall through
# to the OpenAI API via process-env OPENAI_API_KEY, but the live gateway
# still reported "no STT provider" (2026-07-30 ~22:10 and ~22:49 SGT).
# The transcription resolver checks stt.openai.api_key BEFORE any env
# lookup, so injecting the key here is deterministic regardless of how
# env reaches the process. The placeholder is load-bearing (M4): hermes
# YAML cannot expand env vars; deploy/start.sh sed-replaces it at boot.
stt:
  enabled: true
  provider: "openai"
  openai:
    model: "gpt-4o-mini-transcribe"
    api_key: "__OPENAI_KEY_PLACEHOLDER__"

# Suppress the cron executor's default wrapping ("Cronjob Response: ...\n
# (job_id: ...)\n------------\n\n" header and "To stop or manage this
# job, send me a new message..." footer). For a single-user deployment
# the footer's unsubscribe affordance is noise — we already know the
# "stop reminder X" phrase and can list jobs via `hermes cron list`.
# Flag lives at cron/scheduler.py:313 in hermes-agent (undocumented in
# cli-config.yaml.example but production-supported).
cron:
  wrap_response: false

platforms:
  telegram:
    enabled: true
  webhook:
    enabled: true
    port: 8644
    extra:
      secret: __WEBHOOK_SECRET_PLACEHOLDER__
      routes:
        expense-ingest:
          prompt: |
            New bank transaction received via email webhook:
            Bank: {bank}
            Amount: {currency} {amount}
            Merchant: {merchant}
            Date: {date}
            Time: {time}
            Payment method: {payment_method}
            Source: {source}

            Use the expense-tracker skill to categorize and log this transaction.
            When you call log_expense, pass source="email" (this row originated
            from the Gmail webhook, not from a manual user message) AND pass
            time="{time}" — it disambiguates same-day same-amount purchases.
          skills:
            - expense-tracker
          deliver: telegram

# Explicit per-platform toolset allowlist.
# Replaces the broad `hermes-telegram` / `hermes-webhook` presets (each of
# which pulls in ~30 tools including browser_*, image_generate,
# text_to_speech, etc.) with a narrow set relevant to expense tracking.
#
# Dropped from the telegram preset: browser, image_gen, tts.
# Kept: web, terminal, file, vision, skills, messaging (send_message),
# cronjob (for reminder scheduling), todo, memory, session_search, clarify.
#
# Webhook (no user chat, just Gmail → categorize → log) is tighter still —
# drops vision, session_search, clarify on top of the telegram drops.
platform_toolsets:
  telegram:
    - web
    - terminal
    - file
    - vision
    - skills
    - messaging
    - cronjob
    - todo
    - memory
    - session_search
    - clarify
    - expense_tracker
  webhook:
    - web
    - terminal
    - file
    - skills
    - messaging
    - cronjob
    - todo
    - memory
    - expense_tracker

display:
  skin: "default"
