<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3F7FE">
<title>Kevin · Budget</title>
<link rel="apple-touch-icon" href="./kevin-icon.png">
<link rel="icon" type="image/png" href="./kevin-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Nunito:wght@500..800&display=swap" rel="stylesheet">
<!-- vendored + pinned — see the note in index.html; keep both tags in sync -->
<script src="./vendor/supabase-2.111.0.js"></script>
<style>
/* Kevin budget editor — the dedicated spreadsheet page. Full viewport,
   laptop-first, same sky language and auth session as the dashboard. */
:root{
  --bg:#F3F7FE; --panel:#FFFFFF; --paper:#FFFFFF;
  --ink:#0C1B33; --ink2:#5D6E88; --ink3:#93A2B9;
  --accent:#1E55E0; --accent-deep:#1A44AE;
  --hair:rgba(12,27,51,.1); --hair2:rgba(12,27,51,.08);
  --sans:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html{background:var(--bg)}
body{background:var(--bg); color:var(--ink); font-family:var(--sans);
  line-height:1.45; min-height:100svh; -webkit-font-smoothing:antialiased}
a{color:var(--accent-deep); text-decoration:none}
a:hover{text-decoration:underline}
header{
  display:flex; align-items:baseline; justify-content:space-between;
  padding:16px 18px 10px; max-width:1200px; margin:0 auto;
}
.brand{font-family:'Nunito',var(--sans); font-size:19px; font-weight:800}
.brand i{font-style:normal; color:var(--accent)}
.back{font-size:13px}
.wrap{max-width:1200px; margin:0 auto; padding:0 18px 40px}
.note{font-size:12.5px; color:var(--ink3); padding:2px 0 12px}
.note.err{color:#D14479}
.gridwrap{
  overflow:auto; max-height:calc(100svh - 190px);
  background:var(--panel); border:1px solid var(--hair); border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75), 0 1px 2px rgba(32,38,31,.05);
}
table{border-collapse:separate; border-spacing:0; min-width:1020px; width:100%}
th, td{padding:5px 4px; font-size:13px; text-align:right}
thead th{
  position:sticky; top:0; background:var(--panel); z-index:3;
  color:var(--ink3); font-weight:500; padding:10px 4px 8px;
  border-bottom:1px solid var(--hair2);
}
/* sheet-style gridlines: every cell bordered below, verticals from the
   3rd column on (the sticky name column draws its own right border, so a
   border-left on column 2 would double it) */
tbody td{border-bottom:1px solid var(--hair2)}
tbody td:nth-child(n+3), thead th:nth-child(n+3){border-left:1px solid var(--hair2)}
td:first-child, th:first-child{
  text-align:left; position:sticky; left:0; background:var(--panel); z-index:2;
  min-width:190px; max-width:240px; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; font-size:13px; padding:5px 8px 5px 6px;
  border-right:1px solid var(--hair2);
}
thead th:first-child{z-index:4; padding-left:14px}
.catname{
  font:inherit; font-size:13px; width:calc(100% - 24px); padding:3px 6px;
  border:1px solid transparent; border-radius:6px; background:transparent;
  color:var(--ink); vertical-align:middle;
}
.catname:hover{border-color:rgba(32,38,31,.13)}
.catname:focus{outline:2px solid var(--accent); outline-offset:0; background:var(--paper)}
.catname.dirty{border-color:var(--accent); background:#EDF3FF}
.del{
  font:inherit; font-size:11px; border:0; background:none; cursor:pointer;
  color:var(--ink3); padding:2px 4px; opacity:.45; vertical-align:middle;
}
.del:hover{opacity:1; color:#D14479}
tbody tr:hover td{background:rgba(32,38,31,.028)}
tbody tr:hover td:first-child{background:#EEF3FB}
input[type=number]{
  width:74px; font:inherit; font-size:13px; font-variant-numeric:tabular-nums;
  text-align:right; padding:4px 6px; border:1px solid rgba(32,38,31,.13);
  border-radius:7px; background:var(--paper); color:var(--ink);
  -moz-appearance:textfield;
}
/* spinners are dead UI here: ↑↓ navigate cells (sheet-style), focus
   selects-all so typing overwrites */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
input.dirty{border-color:var(--accent); background:#EDF3FF}
input:focus{outline:2px solid var(--accent); outline-offset:0; border-color:transparent}
.toolbar{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:14px 0 6px;
}
.toolbar button{
  font:inherit; font-size:13px; padding:8px 16px; border-radius:10px;
  cursor:pointer; border:1px solid rgba(32,38,31,.16);
  background:var(--paper); color:var(--ink2);
}
.toolbar button.primary{background:var(--accent); border-color:transparent;
  color:#FFFFFF; font-weight:600}
.toolbar button:disabled{opacity:.55; cursor:default}
.toolbar input[type=text]{
  font:inherit; font-size:13px; padding:8px 12px; min-width:200px;
  border:1px solid rgba(32,38,31,.16); border-radius:10px;
  background:var(--paper); color:var(--ink);
}
.toolbar .msg{font-size:12.5px; color:var(--ink3); margin-left:auto}
.toolbar .msg.err{color:#D14479}
.gate{max-width:340px; margin:22vh auto; text-align:center; font-size:14px; color:var(--ink2)}
[hidden]{display:none !important}
</style>
</head>
<body>
<header>
  <span class="brand">Kevin<i>.</i> budget</span>
  <a class="back" href="./index.html">← dashboard</a>
</header>

<div class="gate" id="gate" hidden>
  Not signed in — open the <a href="./index.html">dashboard</a> first,
  log in, then come back.
</div>

<div class="wrap" id="app" hidden>
  <div class="note" id="topnote">blue = unsaved · type to overwrite · ↑ ↓ Enter and Tab move between cells · click a name to rename · ✕ deletes a row · paste from Excel lands from the focused cell · Save writes only what changed</div>
  <div class="gridwrap"><table id="grid"></table></div>
  <div class="toolbar">
    <button id="save" class="primary">Save changes</button>
    <button id="discard">discard changes</button>
    <button id="copyfwd" title="fill the rest of the year from the selected month's values">copy a month forward…</button>
    <input type="text" id="newcat" placeholder="new category (added to all 12 months at 0)">
    <span class="msg" id="msg"></span>
  </div>
</div>

<script>
const SUPABASE_URL = "__SUPABASE_URL__";
const SUPABASE_PUBLISHABLE_KEY = "__SUPABASE_PUBLISHABLE_KEY__";

const $ = s => document.querySelector(s);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const YEAR = String(new Date().getFullYear());
let sb = null;
const orig = {};

function cellKey(cat, m){ return cat + "|" + m; }

const esc = s => s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

async function load(){
  const { data, error } = await sb.from("budgets")
    .select("category,month,limit_amount").like("month", YEAR + "-%");
  if (error){ $("#topnote").className = "note err"; $("#topnote").textContent = error.message; return; }
  const byCat = {};
  for (const r of data){
    const m = parseInt(r.month.slice(5,7), 10);
    (byCat[r.category] = byCat[r.category] || {})[m] = Number(r.limit_amount);
  }
  for (const k in orig) delete orig[k];
  const cats = Object.keys(byCat).sort((a,b) => a.localeCompare(b));
  $("#grid").innerHTML = `
    <thead><tr><th>Category · ${YEAR}</th>${MON.map(m => `<th>${m}</th>`).join("")}</tr></thead>
    <tbody>${cats.map(cat => `<tr><td title="${esc(cat)}"><button class="del" data-del="${esc(cat)}"
      title="delete this category's ${YEAR} budgets">✕</button><input type="text" class="catname"
      data-orig="${esc(cat)}" value="${esc(cat)}"
      title="rename — applies to ${YEAR} budgets only; past transactions keep the old name"></td>${MON.map((_,i) => {
      const v = byCat[cat][i+1] !== undefined ? byCat[cat][i+1] : 0;
      return `<td><input type="number" inputmode="decimal" min="0" step="1"
        data-cat="${esc(cat)}" data-m="${i+1}" value="${v}"></td>`;
    }).join("")}</tr>`).join("")}</tbody>`;
  document.querySelectorAll("[data-cat]").forEach(inp => {
    orig[cellKey(inp.dataset.cat, inp.dataset.m)] = inp.value;
    inp.addEventListener("input", () => inp.classList.toggle(
      "dirty", inp.value !== orig[cellKey(inp.dataset.cat, inp.dataset.m)]));
    // sheet-feel: focusing a cell selects its content, so typing overwrites
    inp.addEventListener("focus", () => inp.select());
  });
  document.querySelectorAll(".catname").forEach(inp =>
    inp.addEventListener("input", () => inp.classList.toggle(
      "dirty", inp.value.trim() !== inp.dataset.orig)));
  document.querySelectorAll(".del").forEach(btn =>
    btn.addEventListener("click", () => deleteCat(btn.dataset.del)));
}

async function save(){
  // renames run first (they move all 12 rows to the new key), then the cell
  // upserts land under the post-rename names
  const renames = {};
  document.querySelectorAll(".catname").forEach(inp => {
    const nv = inp.value.trim();
    if (nv && nv !== inp.dataset.orig) renames[inp.dataset.orig] = nv;
  });
  const upserts = [];
  document.querySelectorAll("[data-cat]").forEach(inp => {
    const v = parseFloat(inp.value);
    if (!isNaN(v) && String(inp.value) !== orig[cellKey(inp.dataset.cat, inp.dataset.m)]){
      upserts.push({ category: renames[inp.dataset.cat] || inp.dataset.cat,
        month: YEAR + "-" + String(inp.dataset.m).padStart(2,"0"),
        limit_amount: v });
    }
  });
  const nn = $("#newcat").value.trim();
  if (nn) for (let m = 1; m <= 12; m++){
    upserts.push({ category: nn,
      month: YEAR + "-" + String(m).padStart(2,"0"), limit_amount: 0 });
  }
  const nRen = Object.keys(renames).length;
  if (!upserts.length && !nRen){ $("#msg").textContent = "nothing changed"; return; }
  $("#save").disabled = true;
  $("#msg").className = "msg";
  $("#msg").textContent = "saving…";
  let failure = null;
  for (const [from, to] of Object.entries(renames)){
    const { data, error } = await sb.from("budgets").update({ category: to })
      .eq("category", from).like("month", YEAR + "-%").select("month");
    if (error){ failure = `rename "${from}": ${error.message}`; break; }
    // RLS without an update policy "succeeds" touching 0 rows — call it out
    if (!data.length){ failure = `rename "${from}" touched 0 rows — run supabase/migrations/0002_budget_write_policies.sql`; break; }
  }
  if (!failure && upserts.length){
    const { error } = await sb.from("budgets")
      .upsert(upserts, { onConflict: "category,month" });
    if (error) failure = error.message;
  }
  $("#save").disabled = false;
  if (failure){
    $("#msg").className = "msg err";
    $("#msg").textContent = failure;
    if (nRen) await load();   // resync after a half-applied rename batch
    return;
  }
  $("#newcat").value = "";
  $("#msg").textContent = "saved ✓" +
    (nRen ? " — renames apply to budgets only; past transactions keep the old name" : "");
  await load();
}

async function deleteCat(cat){
  if (!confirm(`Delete "${cat}" — this removes its ${YEAR} budget rows (Jan–Dec).\n\n` +
    `Past transactions keep the category, and Kevin re-adds it at $0 if he files ` +
    `something under it again. Delete?`)) return;
  $("#msg").className = "msg";
  $("#msg").textContent = "deleting…";
  const { data, error } = await sb.from("budgets").delete()
    .eq("category", cat).like("month", YEAR + "-%").select("month");
  if (error){ $("#msg").className = "msg err"; $("#msg").textContent = error.message; return; }
  if (!data.length){
    $("#msg").className = "msg err";
    $("#msg").textContent = "delete touched 0 rows — run supabase/migrations/0002_budget_write_policies.sql";
    return;
  }
  $("#msg").textContent = `deleted "${cat}" (${data.length} rows)`;
  await load();
}

function discard(){
  document.querySelectorAll("[data-cat]").forEach(inp => {
    inp.value = orig[cellKey(inp.dataset.cat, inp.dataset.m)];
    inp.classList.remove("dirty");
  });
  document.querySelectorAll(".catname").forEach(inp => {
    inp.value = inp.dataset.orig;
    inp.classList.remove("dirty");
  });
  $("#newcat").value = "";
  $("#msg").className = "msg";
  $("#msg").textContent = "changes discarded";
}

/* Excel/Sheets paste: tab-separated cells fan out right and down from the
   focused cell; "$1,234.50" cleans to 1234.5; non-numeric cells are skipped */
function pasteGrid(e){
  const anchor = e.target;
  if (!anchor.dataset || !anchor.dataset.cat) return;
  const text = (e.clipboardData || window.clipboardData).getData("text");
  if (!text) return;
  e.preventDefault();
  const rows = text.replace(/\r/g,"").split("\n");
  while (rows.length && rows[rows.length-1] === "") rows.pop();
  const trs = [...document.querySelectorAll("#grid tbody tr")];
  const r0 = trs.findIndex(tr => tr.contains(anchor));
  const c0 = parseInt(anchor.dataset.m, 10) - 1;
  let n = 0;
  rows.forEach((row, dr) => {
    const tr = trs[r0 + dr];
    if (!tr) return;
    const inputs = tr.querySelectorAll("[data-cat]");
    row.split("\t").forEach((cell, dc) => {
      const inp = inputs[c0 + dc];
      const v = parseFloat(cell.replace(/[$,\s]/g,""));
      if (!inp || isNaN(v)) return;
      inp.value = v; n++;
      inp.classList.toggle("dirty",
        inp.value !== orig[cellKey(inp.dataset.cat, inp.dataset.m)]);
    });
  });
  $("#msg").className = "msg";
  $("#msg").textContent = n
    ? `pasted ${n} cell${n>1?"s":""} — review, then Save` : "nothing numeric to paste";
}

/* Sheet-style cell movement: ↑/↓ and Enter move within the column
   (preventDefault also kills the number input's native value-spin, which
   is a footgun on budget figures); ←/→ keep their native caret behavior
   for in-cell edits; Tab already walks right through the DOM order. */
function moveCell(inp, dr){
  const trs = [...document.querySelectorAll("#grid tbody tr")];
  const r = trs.findIndex(tr => tr.contains(inp));
  const tr = trs[r + dr];
  if (!tr) return;
  const target = tr.querySelector(`[data-m="${inp.dataset.m}"]`);
  if (target) target.focus();
}

function gridKeys(e){
  const inp = e.target;
  if (!inp.dataset || !inp.dataset.cat) return;
  if (e.key === "ArrowUp"){ e.preventDefault(); moveCell(inp, -1); }
  else if (e.key === "ArrowDown" || e.key === "Enter"){
    e.preventDefault(); moveCell(inp, 1);
  }
}

function copyForward(){
  const from = prompt("Copy which month forward? (1-12)\nIts values fill every LATER month in the grid — review, then Save.");
  const m = parseInt(from, 10);
  if (isNaN(m) || m < 1 || m > 12) return;
  document.querySelectorAll("tbody tr").forEach(tr => {
    const inputs = tr.querySelectorAll("[data-cat]");
    const src = inputs[m-1].value;
    inputs.forEach((inp, i) => {
      if (i > m-1 && inp.value !== src){
        inp.value = src;
        inp.classList.toggle("dirty",
          inp.value !== orig[cellKey(inp.dataset.cat, inp.dataset.m)]);
      }
    });
  });
  $("#msg").textContent = `copied ${MON[m-1]} forward — review, then Save`;
}

async function main(){
  if (SUPABASE_PUBLISHABLE_KEY.startsWith("__")){
    $("#gate").hidden = false;
    $("#gate").textContent = "Setup: paste the publishable key into pwa/budget.html";
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ $("#gate").hidden = false; return; }
  $("#app").hidden = false;
  $("#save").addEventListener("click", save);
  $("#discard").addEventListener("click", discard);
  $("#copyfwd").addEventListener("click", copyForward);
  $("#grid").addEventListener("paste", pasteGrid);
  $("#grid").addEventListener("keydown", gridKeys);
  await load();
}
main();
</script>
</body>
</html>
