/* ————— auth gate.
   Standalone PWAs get a 6-digit code flow: a magic LINK opens in the
   browser (separate storage — the session never reaches the installed
   app), but a code typed here lands the session in the right place.
   The email carries both; the link still works for desktop. ————— */
async function main(){
  if (IS_FILE || SUPABASE_PUBLISHABLE_KEY.startsWith("__")){
    loadSample();
    CURVD = await resolveView();
    updateNav();
    $("#app").hidden = false; $("#dockwrap").hidden = false;
    renderAll();
    if (!IS_FILE){
      $("#f-sync").textContent = "setup: paste the publishable key into pwa/index.html";
    }
    return;
  }

  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const { data: { session } } = await sb.auth.getSession();

  if (!session){
    $("#gate").hidden = false;
    let sentTo = null;
    $("#gate-send").addEventListener("click", async () => {
      const email = $("#gate-email").value.trim();
      if (!email) return;
      $("#gate-send").disabled = true;
      $("#gate-note").className = "gnote";
      $("#gate-note").textContent = "sending…";
      const { error } = await sb.auth.signInWithOtp({
        email, options: { emailRedirectTo: location.origin + location.pathname },
      });
      $("#gate-send").disabled = false;
      if (error){
        console.error("signInWithOtp:", error);
        $("#gate-note").className = "gnote err";
        $("#gate-note").textContent = (error.message && error.message !== "{}")
          ? error.message
          : "couldn't send the email — check Supabase Auth Logs (usually the SMTP password)";
      } else {
        sentTo = email;
        $("#codewrap").hidden = false;
        $("#gate-msg").textContent = "Check your inbox — type the code here.";
        $("#gate-note").textContent = "on a computer, the link in the email works too";
        $("#gate-code").focus();
      }
    });
    $("#gate-verify").addEventListener("click", async () => {
      const token = $("#gate-code").value.trim();
      if (!sentTo || !token) return;
      $("#gate-verify").disabled = true;
      $("#gate-note").className = "gnote";
      $("#gate-note").textContent = "verifying…";
      const { error } = await sb.auth.verifyOtp({ email: sentTo, token, type: "email" });
      if (error){
        console.error("verifyOtp:", error);
        $("#gate-verify").disabled = false;
        $("#gate-note").className = "gnote err";
        $("#gate-note").textContent = (error.message && error.message !== "{}")
          ? error.message : "code rejected — request a fresh one and retry";
      }
      // success → onAuthStateChange reloads
    });
    sb.auth.onAuthStateChange((_e, s) => { if (s) location.reload(); });
    return;
  }

  $("#app").hidden = false; $("#dockwrap").hidden = false;
  $("#signout").hidden = false; $("#fsep").hidden = false;
  $("#bedit").hidden = false; $("#beditfoot").hidden = false;
  $("#signout").addEventListener("click", async () => {
    await sb.auth.signOut(); location.reload();
  });
  // tap the sync line to refetch on demand
  $("#f-sync").style.cursor = "pointer";
  $("#f-sync").addEventListener("click", async () => {
    $("#f-sync").textContent = "syncing…";
    try { await loadData(); renderAll(); }
    catch (e){ $("#f-sync").textContent = "sync failed: " + e.message; }
  });

  try {
    await loadData();
    updateNav();
    renderAll();
  } catch (err){
    // RLS returns zero rows (not an error) for the wrong login; real errors
    // land here. Keep the shell visible, say what happened.
    $("#mlabel").classList.add("stale");
    $("#f-sync").textContent = "sync failed: " + err.message + " — tap to retry";
    renderAll();
  }

  // refresh when the PWA comes back to the foreground (bookmark reopened)
  document.addEventListener("visibilitychange", async () => {
    if (!document.hidden && D.syncedAt && Date.now() - D.syncedAt.getTime() > 60000){
      try { await loadData(); renderAll(); } catch (e) { /* keep stale view */ }
    }
  });
}
main();
</script>
